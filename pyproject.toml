[project]
name = "market-regime-radar"
version = "5.0.0"
description = "A reproducible market-regime research dashboard consuming data_mesh snapshots"
requires-python = ">=3.13"
dependencies = [
    "exchange-calendars>=4.13.2",
    "fastapi>=0.149.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
